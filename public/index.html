<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DC Capacity Control</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%232a78d6'/%3E%3Crect x='10' y='8' width='12' height='3' rx='1' fill='white'/%3E%3Crect x='10' y='14' width='12' height='3' rx='1' fill='white'/%3E%3Crect x='10' y='20' width='12' height='3' rx='1' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn nav-toggle" data-act="toggle-nav" aria-label="Menu">☰</button>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><strong>DC Capacity Control</strong><small>Capacity Planning &amp; Infrastructure Validation</small></div></div>
    <label class="top-field"><span>Project</span><select id="project-select"></select></label>
    <div class="top-spacer"></div>
    <button class="icon-btn bell" data-act="notifications" aria-label="Notifications">🔔<span id="bell-count" class="badge" hidden></span></button>
    <label class="top-field"><span>Signed in as</span><select id="user-select"></select></label>
  </header>
  <div class="layout">
    <nav class="sidenav" id="sidenav"></nav>
    <main id="main" tabindex="-1"><div class="loading">Loading…</div></main>
  </div>
  <div id="drawer" class="drawer" hidden></div>
  <dialog id="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tip" class="tip" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
